      <g font-family="Arial,sans-serif" font-size="9" fill="#bdbdc8" text-anchor="middle">
        <circle cx="393" cy="775" r="22" fill="#222331" stroke="#e62429" stroke-width="2"/><text x="393" y="779" fill="#fff" font-weight="700">+</text><text x="393" y="808">Sua história</text>
        <circle cx="461" cy="775" r="22" fill="#293144" stroke="#e62429" stroke-width="2"/><text x="461" y="779" fill="#fff" font-size="8">TH</text><text x="461" y="808">Thor</text>
        <circle cx="529" cy="775" r="22" fill="#4b3026" stroke="#e62429" stroke-width="2"/><text x="529" y="779" fill="#fff" font-size="8">IM</text><text x="529" y="808">Tony</text>
        <circle cx="597" cy="775" r="22" fill="#34334a" stroke="#e62429" stroke-width="2"/><text x="597" y="779" fill="#fff" font-size="8">NW</text><text x="597" y="808">Natasha</text>
        <circle cx="665" cy="775" r="22" fill="#394137" stroke="#e62429" stroke-width="2"/><text x="665" y="779" fill="#fff" font-size="8">HU</text><text x="665" y="808">Hulk</text>
      </g>
      <rect x="369" y="819" width="342" height="37" rx="10" fill="#1d1d2c" stroke="#292932"/><circle cx="387" cy="837" r="6" fill="none" stroke="#9999a6" stroke-width="1.5"/><path d="M392 842l5 5" stroke="#9999a6" stroke-width="1.5"/><text x="405" y="841" fill="#858592" font-family="Arial,sans-serif" font-size="10">Buscar posts ou personagens</text>
