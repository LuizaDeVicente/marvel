      <rect x="369" y="865" width="342" height="370" rx="14" fill="#15151e" stroke="#292933"/>
      <circle cx="390" cy="887" r="13" fill="#e62429"/><circle cx="390" cy="887" r="10" fill="#233047"/><path d="M383 891q7-12 14 0z" fill="#e5e7ed"/>
      <text x="411" y="884" fill="#f5f5f7" font-family="Arial,sans-serif" font-size="11" font-weight="700">Capitão América</text>
      <text x="411" y="899" fill="#92929e" font-family="Arial,sans-serif" font-size="9">agora · Nova York</text>
      <g fill="#d4d4db"><circle cx="692" cy="882" r="2"/><circle cx="692" cy="889" r="2"/><circle cx="692" cy="896" r="2"/></g>
      <text x="381" y="920" fill="#f0f0f3" font-family="Arial,sans-serif" font-size="10"><tspan font-weight="700">Capitão América</tspan><tspan>  Treino concluído. Próxima missão?</tspan></text>
      <g clip-path="url(#postimg)">
        <rect x="370" y="927" width="340" height="136" fill="url(#scene)"/>
        <circle cx="635" cy="948" r="24" fill="#ffd79e" opacity=".85"/>
        <path d="M370 1010l39-28 32 22 45-38 29 34 44-23 44 29 43-35 64 39v53H370z" fill="#252838"/>
        <path d="M370 1030l52-29 35 25 40-32 46 29 46-30 44 33 44-27 33 22v42H370z" fill="#141923"/>
        <g fill="#090d14"><path d="M380 1017h28v46h-28zM420 1010h34v53h-34zM467 1020h39v43h-39zM518 1006h35v57h-35zM565 1019h31v44h-31zM609 1008h41v55h-41zM662 1017h38v46h-38z"/></g>
        <path d="M370 1048l340-26v41H370z" fill="#252a34"/>
        <g transform="translate(550 1020) rotate(-12)"><circle r="25" fill="#17263a" stroke="#080d15" stroke-width="3"/><circle r="21" fill="url(#shield)" stroke="#f0f0f2" stroke-width="4"/><circle r="13" fill="#d4d7dd"/><circle r="9" fill="#193d66"/><path d="M0-6l2 5 5 1-4 3 1 6-4-4-5 4 2-6-5-3 6-1z" fill="#fff"/></g>
      </g>
      <text x="381" y="1077" fill="#f0b323" font-family="Arial,sans-serif" font-size="10">★ 128 curtidas · ver quem curtiu</text>
      <g font-family="Arial,sans-serif" font-size="9" font-weight="700" text-anchor="middle">
        <text x="409" y="1103" fill="#e62429">♥  Curtir</text><text x="486" y="1103" fill="#b8b8c7">▢  Comentar</text><text x="667" y="1103" fill="#b8b8c7">↗  Enviar</text>
      </g>
      <path d="M558 1088v15l5-3 5 3v-15z" fill="none" stroke="#b8b8c7" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="587" y="1103" fill="#b8b8c7" font-family="Arial,sans-serif" font-size="9" font-weight="700" text-anchor="middle">Salvar</text>
      <path d="M377 1115h326" stroke="#292932" stroke-width="1"/>
      <text x="381" y="1137" fill="#d9d9e0" font-family="Arial,sans-serif" font-size="9"><tspan font-weight="700">Tony Stark:</tspan><tspan> Boa, parceiro!</tspan></text>
      <text x="381" y="1155" fill="#9696a2" font-family="Arial,sans-serif" font-size="9">Ver todos os 24 comentários</text>
      <text x="381" y="1173" fill="#858592" font-family="Arial,sans-serif" font-size="8">PUBLICAÇÃO DE EXEMPLO · PERSONAGEM DA API MARVEL</text>
      <path d="M352 1203h376" stroke="#292932" stroke-width="1.4"/>
      <!-- project's five-item mobile footer -->
      <g fill="#aaaab6" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">
        <path d="M390 1214h15v12h-15z" fill="none" stroke="#e62429" stroke-width="1.6"/><text x="397" y="1241" fill="#e62429">Início</text>
        <circle cx="471" cy="1220" r="7" fill="none" stroke="#aaaab6" stroke-width="1.5"/><path d="M461 1230q10-12 20 0" fill="none" stroke="#aaaab6" stroke-width="1.5"/><text x="471" y="1241">Amigos</text>
        <circle cx="540" cy="1220" r="13" fill="#e62429"/><path d="M540 1213v14m-7-7h14" stroke="#fff" stroke-width="2"/><text x="540" y="1241">Criar</text>
        <path d="M601 1214h17v13h-17z" fill="none" stroke="#aaaab6" stroke-width="1.5"/><path d="M601 1215l8 6 9-6" fill="none" stroke="#aaaab6" stroke-width="1.4"/><text x="609" y="1241">Chats</text>
        <circle cx="684" cy="1217" r="6" fill="none" stroke="#aaaab6" stroke-width="1.5"/><path d="M674 1231q10-12 20 0" fill="none" stroke="#aaaab6" stroke-width="1.5"/><text x="684" y="1241">Perfil</text>
      </g>
      <rect x="473" y="1264" width="134" height="4" rx="2" fill="#eeeef2" opacity=".8"/>
