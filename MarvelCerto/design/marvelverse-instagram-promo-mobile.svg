<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11111a"/><stop offset=".55" stop-color="#09090f"/><stop offset="1" stop-color="#1a0c11"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#e62429" stop-opacity=".6"/><stop offset="1" stop-color="#e62429" stop-opacity="0"/></radialGradient>
    <linearGradient id="scene" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e88962"/><stop offset=".55" stop-color="#49304b"/><stop offset="1" stop-color="#111824"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f24950"/><stop offset="1" stop-color="#a40e1a"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".6"/></filter>
    <clipPath id="screen"><rect x="352" y="561" width="376" height="716" rx="32"/></clipPath>
    <clipPath id="postimg"><rect x="370" y="927" width="340" height="136"/></clipPath>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="541" cy="910" r="450" fill="url(#glow)" filter="url(#blur)"/>
  <path d="M0 0h1080v10H0z" fill="#e62429"/>
  <g opacity=".14" stroke="#e62429" stroke-width="2"><path d="M-50 245L1020 86M-40 293L1055 130M-30 341L1090 174M210 0L104 401M366 0L260 404M522 0L416 408"/></g>
  <g transform="translate(884 100)"><circle r="33" fill="none" stroke="#e62429" stroke-opacity=".45" stroke-width="2"/><path d="M0-22l6 15 17 1-13 10 5 17L0 12l-15 9 5-17-13-10 17-1z" fill="#e62429"/></g>
  <text x="72" y="100" fill="#f2f2f5" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="4">UM NOVO JEITO DE VIVER</text>
  <text x="72" y="134" fill="#e62429" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="4">O UNIVERSO MARVEL</text>
  <text x="66" y="258" fill="#fff" font-family="Arial,sans-serif" font-size="86" font-weight="900" letter-spacing="-4">SEU TIME.</text>
  <text x="66" y="349" fill="#fff" font-family="Arial,sans-serif" font-size="86" font-weight="900" letter-spacing="-4">SUAS</text>
  <text x="66" y="440" fill="#e62429" font-family="Arial,sans-serif" font-size="86" font-weight="900" letter-spacing="-4">AVENTURAS.</text>
  <text x="72" y="492" fill="#c5c5cf" font-family="Arial,sans-serif" font-size="22">Conheça o MarvelVerse: personagens, comunidade</text>
  <text x="72" y="523" fill="#c5c5cf" font-family="Arial,sans-serif" font-size="22">e desafios em um app feito para fãs.</text>

  <!-- Portrait Android app screen preview based on the project's mobile feed -->
  <g filter="url(#shadow)">
    <rect x="333" y="540" width="414" height="757" rx="51" fill="#050509" stroke="#585862" stroke-width="3"/>
    <rect x="352" y="561" width="376" height="716" rx="32" fill="#0b0b12"/>
    <g clip-path="url(#screen)">
      <rect x="352" y="561" width="376" height="716" fill="#0b0b12"/>
      <rect x="486" y="570" width="108" height="12" rx="6" fill="#050509"/>
      <text x="370" y="600" fill="#fff" font-family="Arial,sans-serif" font-size="10" font-weight="700">9:41</text>
      <g fill="#dedee4"><path d="M672 591h3v8h-3zm5-3h3v11h-3zm5-3h3v14h-3z"/><rect x="692" y="590" width="18" height="10" rx="3" fill="none" stroke="#dedee4" stroke-width="1.4"/></g>
      <!-- app top bar from the actual app layout -->
      <rect x="352" y="609" width="376" height="50" fill="#14141f"/>
      <g stroke="#d7d7df" stroke-width="2" stroke-linecap="round"><path d="M371 625h17M371 632h17M371 639h17"/></g>
      <text x="404" y="642" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="800" letter-spacing=".7">MARVELVERSE</text>
      <circle cx="679" cy="634" r="13" fill="#1d1d2c"/><path d="M675 638v-7q4-7 8 0v7m-10 0h12m-7 2q1 3 2 0" fill="none" stroke="#d7d7df" stroke-width="1.4"/>
      <circle cx="710" cy="634" r="13" fill="#1d1d2c"/><path d="M704 630h12v9h-12zm0 0l6 5 6-5" fill="none" stroke="#d7d7df" stroke-width="1.4"/>
      <!-- feed title and filters -->
      <text x="370" y="687" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Feed</text>
      <text x="370" y="704" fill="#aaaab6" font-family="Arial,sans-serif" font-size="10">Publicações da comunidade Marvel</text>
      <text x="697" y="690" fill="#e62429" font-family="Arial,sans-serif" font-size="24" font-weight="700">↻</text>
      <rect x="369" y="714" width="166" height="31" rx="10" fill="#e62429"/><text x="452" y="734" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Para você</text>
      <rect x="542" y="714" width="168" height="31" rx="10" fill="#1d1d2c"/><text x="626" y="734" fill="#c6c6d0" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Seguindo</text>
