      <circle cx="176" cy="880" r="18" fill="#e62429"/><circle cx="176" cy="880" r="14" fill="#233047"/><path d="M165 885q11-18 22 0z" fill="#e5e7ed"/>
      <text x="205" y="878" fill="#f5f5f7" font-family="Arial,sans-serif" font-size="15" font-weight="700">Capitão América</text>
      <text x="205" y="896" fill="#92929e" font-family="Arial,sans-serif" font-size="11">agora · Nova York</text>
      <g fill="#d4d4db"><circle cx="908" cy="874" r="2.5"/><circle cx="908" cy="882" r="2.5"/><circle cx="908" cy="890" r="2.5"/></g>
