<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11111a"/><stop offset=".55" stop-color="#09090f"/><stop offset="1" stop-color="#1a0c11"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#e62429" stop-opacity=".56"/><stop offset="1" stop-color="#e62429" stop-opacity="0"/></radialGradient>
    <linearGradient id="scene" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e78962"/><stop offset=".55" stop-color="#47304a"/><stop offset="1" stop-color="#111824"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f24950"/><stop offset="1" stop-color="#a40e1a"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".55"/></filter>
    <clipPath id="screen"><rect x="125" y="695" width="830" height="585" rx="34"/></clipPath>
    <clipPath id="postimage"><rect x="151" y="907" width="778" height="255"/></clipPath>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="812" cy="429" r="315" fill="url(#glow)" filter="url(#blur)"/>
  <path d="M0 0h1080v11H0z" fill="#e62429"/>
  <g opacity=".13" stroke="#e62429" stroke-width="2"><path d="M-80 205l1040-94M-65 252l1070-99M-50 300l1090-104M176 0L85 377M330 0L240 377M484 0L394 377"/></g>
  <g transform="translate(883 113)"><circle r="34" fill="none" stroke="#e62429" stroke-opacity=".5" stroke-width="2"/><path d="M0-24l6 16 18 1-14 11 5 17L0 11l-15 10 5-17-14-11 18-1z" fill="#e62429"/></g>
  <text x="72" y="112" fill="#f2f2f5" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">UM NOVO JEITO DE VIVER</text>
  <text x="72" y="147" fill="#e62429" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">O UNIVERSO MARVEL</text>
  <text x="66" y="278" fill="#fff" font-family="Arial,sans-serif" font-size="87" font-weight="900" letter-spacing="-4">SEU TIME.</text>
  <text x="66" y="370" fill="#fff" font-family="Arial,sans-serif" font-size="87" font-weight="900" letter-spacing="-4">SUAS</text>
  <text x="66" y="462" fill="#e62429" font-family="Arial,sans-serif" font-size="87" font-weight="900" letter-spacing="-4">AVENTURAS.</text>
  <text x="72" y="512" fill="#c5c5cf" font-family="Arial,sans-serif" font-size="23">Conheça o MarvelVerse: personagens, comunidade</text>
  <text x="72" y="544" fill="#c5c5cf" font-family="Arial,sans-serif" font-size="23">e desafios em um só lugar.</text>

