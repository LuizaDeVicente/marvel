      <g fill="none" stroke="#d6d6de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M202 1197h28v-23h-28zM206 1174l10 10 10-10"/><path d="M261 1185l18-12v24zM279 1185h17"/><path d="M906 1174v25l-10-7-10 7v-25z"/></g>
      <text x="151" y="1223" fill="#f1f1f4" font-family="Arial,sans-serif" font-size="13" font-weight="700">Curtido por 128 pessoas</text>
      <text x="151" y="1240" fill="#f0f0f3" font-family="Arial,sans-serif" font-size="13"><tspan font-weight="700">Capitão América</tspan><tspan>  Treino concluído. Próxima missão?</tspan></text>
      <!-- bottom navigation -->
      <path d="M125 1252h830" stroke="#292932" stroke-width="1.5"/>
      <g fill="none" stroke="#b8b8c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M166 1270h18v-16h-18zM208 1262h19m-10-9v19"/><circle cx="271" cy="1261" r="8"/><path d="M260 1276q11-13 22 0"/><path d="M867 1256h22v19h-22z"/></g>
      <path d="M847 1261l9-7 9 7v14h-18z" fill="#e62429" opacity=".9"/>
