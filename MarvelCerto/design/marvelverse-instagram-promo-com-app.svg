        <circle cx="265" cy="801" r="24" fill="#e62429"/><circle cx="265" cy="801" r="20" fill="#293144"/><text x="265" y="805" fill="#fff" font-size="10">TH</text><text x="265" y="837">Thor</text>
        <circle cx="350" cy="801" r="24" fill="#e62429"/><circle cx="350" cy="801" r="20" fill="#4b3026"/><text x="350" y="805" fill="#fff" font-size="10">IM</text><text x="350" y="837">Tony</text>
        <circle cx="435" cy="801" r="24" fill="#e62429"/><circle cx="435" cy="801" r="20" fill="#34334a"/><text x="435" y="805" fill="#fff" font-size="10">NW</text><text x="435" y="837">Natasha</text>
        <circle cx="520" cy="801" r="24" fill="#e62429"/><circle cx="520" cy="801" r="20" fill="#394137"/><text x="520" y="805" fill="#fff" font-size="10">HU</text><text x="520" y="837">Bruce</text>
      </g>
